name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter
      - run: flutter test
        working-directory: flutter
      - name: Build web
        working-directory: flutter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DEFINES=""
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          fi
          flutter build web --release --base-href / $DEFINES
      - run: |
          touch build/web/.nojekyll
          echo handover.alfarisgrp.com > build/web/CNAME
        working-directory: flutter
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter/build/web
      - id: deploy
        uses: actions/deploy-pages@v4
