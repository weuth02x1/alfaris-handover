name: GitHub Pages

# Flutter on GitHub Pages is no longer the product. Keep the workflow
# disabled so a push cannot republish the old site onto the company domain.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "Disabled. Host the ASP.NET app on IIS at handover.alfarisgrp.com."
