name: GitHub Pages

on:
  push:
    branches: [main, cursor/http-no-ssl-0f10, cursor/mail-failed-fix-0f10]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter
      - run: flutter test
        working-directory: flutter
      - name: Build web
        working-directory: flutter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Mail key is missing; login will not send email."
            flutter build web --release --base-href /alfaris-handover/
            exit 0
          fi
          python3 - <<'PY'
          import json, os, pathlib, sys
          key = os.environ["SUPABASE_ANON_KEY"].strip()
          url = (os.environ.get("SUPABASE_URL") or "https://sfshhcfjowiptefesqgp.supabase.co").strip()
          if key.startswith("http"):
              sys.exit("SUPABASE_ANON_KEY is a URL. Use the Publishable key from Supabase → Settings → API Keys.")
          if len(key) < 20:
              sys.exit("SUPABASE_ANON_KEY is too short to be a Publishable key.")
          pathlib.Path("/tmp/dart-defines.json").write_text(json.dumps({"SUPABASE_URL": url, "SUPABASE_ANON_KEY": key}))
          print("Mail key is present; sign-in codes will be emailed.")
          PY
          flutter build web --release --base-href /alfaris-handover/ --dart-define-from-file=/tmp/dart-defines.json
          python3 - <<'PY'
          import os, pathlib, sys
          key = os.environ["SUPABASE_ANON_KEY"].strip()
          js = pathlib.Path("build/web/main.dart.js").read_text(encoding="utf-8", errors="replace")
          slices = [key[i:i + 12] for i in range(0, min(len(key), 60), 12) if len(key[i:i + 12]) >= 8]
          hits = sum(1 for part in slices if part in js)
          print("define_slices_found", hits, "of", len(slices))
          if hits == 0:
              sys.exit("Publishable key was not baked into the web build.")
          PY
          rm -f /tmp/dart-defines.json
      - run: touch build/web/.nojekyll
        working-directory: flutter
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
