name: GitHub Pages

on:
  push:
    branches: [main, cursor/http-no-ssl-0f10, cursor/mail-failed-fix-0f10]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter
      - run: flutter test
        working-directory: flutter
      - name: Build web
        working-directory: flutter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DEFINES=""
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "Mail key is present; sign-in codes will be emailed."
            DEFINES="--dart-define=SUPABASE_URL=${SUPABASE_URL:-https://sfshhcfjowiptefesqgp.supabase.co} --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          else
            echo "Mail key is missing; login will not send email until SUPABASE_ANON_KEY is set as a GitHub Actions secret."
          fi
          flutter build web --release --base-href /alfaris-handover/ $DEFINES
      - run: touch build/web/.nojekyll
        working-directory: flutter
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
