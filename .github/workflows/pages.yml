name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter
      - run: flutter test
        working-directory: flutter
      - name: Build web
        working-directory: flutter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://sfshhcfjowiptefesqgp.supabase.co}"
          DEFINES="--dart-define=SUPABASE_URL=$URL"
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            DEFINES="$DEFINES --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            python3 - <<'PY'
import json, os
url = os.environ.get("SUPABASE_URL") or "https://sfshhcfjowiptefesqgp.supabase.co"
key = os.environ["SUPABASE_ANON_KEY"]
open("web/supabase.json", "w").write(json.dumps({"url": url, "anonKey": key}))
PY
          fi
          flutter build web --release --base-href /alfaris-handover/ $DEFINES
          if [ -f web/supabase.json ]; then
            cp web/supabase.json build/web/supabase.json
          fi
      - run: touch build/web/.nojekyll
        working-directory: flutter
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter/build/web
      - id: deploy
        uses: actions/deploy-pages@v4
