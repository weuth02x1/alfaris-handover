name: Deploy Resend OTP worker

on:
  push:
    branches: [main]
    paths:
      - workers/otp.js
      - wrangler.toml
      - .github/workflows/otp-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Cloudflare worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$RESEND_API_KEY" ]; then
            echo "Skip worker deploy until RESEND_API_KEY and CLOUDFLARE_API_TOKEN are set as GitHub secrets."
            exit 0
          fi
          npm install --no-save wrangler
          npx wrangler secret put RESEND_API_KEY --name alfaris-handover-otp <<< "$RESEND_API_KEY"
          if [ -n "$RESEND_FROM" ]; then
            npx wrangler secret put RESEND_FROM --name alfaris-handover-otp <<< "$RESEND_FROM"
          fi
          npx wrangler deploy
